[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[project]
name = "guru"
version = "0.1.0"
description = "Dashboard for tracking monthly spending, savings, and long-term goals."
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "atlas-provider-sqlalchemy>=0.5.0",
    "plaid-python>=39.2.0",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.38",
]

[tool.uv.build-backend]
module-name = "guru"
module-root = "backend/src"
namespace = true

[project.scripts]
guru = "guru.api.main:main"
