name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14.5"

      - run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check backend/src

      - name: Ty check
        run: uv run ty check backend/src
